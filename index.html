
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121c">
  <title>SaChat — Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">S</span><span>SaChat</span></div>
      <div class="section-label">MESSAGES</div>
      <input id="search" placeholder="Search people...">
      <div id="people" class="people"></div>
      <div class="profile">
        <div class="avatar">S</div>
        <div class="profile-info">
          <strong id="myName">My account</strong>
          <small>Online</small>
        </div>
        <button id="logout" title="Sign out">↗</button>
      </div>
    </aside>

    <main class="main">
      <section id="authScreen" class="auth-screen">
        <div class="auth-card glass">
          <div class="brand-icon large">S</div>
          <h1>Welcome to <i>SaChat.</i></h1>
          <p>Your conversations, in a different light.</p>
          <input id="displayName" placeholder="Your name (for registration)">
          <input id="email" type="email" placeholder="Email address">
          <input id="password" type="password" placeholder="Password">
          <button id="register" class="primary">Create account</button>
          <button id="login" class="secondary">Sign in</button>
          <p id="authError" class="error"></p>
        </div>
      </section>

      <section id="welcome" class="welcome">
        <div class="welcome-mark">S</div>
        <h1>Good conversations<br><i>start here.</i></h1>
        <p>Select someone from your contacts to begin chatting.</p>
      </section>

      <section id="chatScreen" class="chat-screen hidden">
        <header class="chat-header glass">
          <div class="avatar" id="chatAvatar">S</div>
          <div class="chat-person">
            <strong id="chatName">User</strong>
            <small>SaChat member</small>
          </div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer glass">
          <input id="messageInput" placeholder="Write a message..." autocomplete="off">
          <button class="send" type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
